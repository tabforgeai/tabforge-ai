# ==============================================================================
# EasyAI configuration
#
# FULL REFERENCE, with what every key does and where the library uses it:
#     docs/easyai_properties_guide.txt      (in the tabforge-ai repository)
#     https://github.com/tabforgeai/tabforge-ai/blob/main/docs/easyai_properties_guide.txt
#
# This file is OPTIONAL and everything in it can also be set in code
# (EasyAI.configure(...), or .withApiKey(...) / .withModel(...) per builder).
#
# NEVER COMMIT A REAL KEY. Keep the values empty in git and fill them locally.
#
# The one idea that explains the layout: voice and decisions INHERIT the chat
# provider, key and base URL below, so an app that configured chat usually needs
# nothing else. Model names are never inherited - each capability has its own.
# ==============================================================================

# --- Chat: the base settings every other capability inherits ------------------
# provider: openai | ollama   ("openai" also covers any OpenAI-COMPATIBLE
# service - Groq, Azure OpenAI, DeepSeek, vLLM - via easyai.base-url)
easyai.provider=openai
easyai.api-key=
easyai.model-name=gpt-4o-mini
#easyai.base-url=
#easyai.temperature=0.7
#easyai.max-tokens=2000

# OpenAI example:
#   easyai.provider=openai
#   easyai.api-key=sk-YOUR-KEY
#   easyai.model-name=gpt-4o-mini
#   (no base-url needed - OpenAI is the default endpoint)
#
# Groq example (OpenAI-compatible, so the provider stays "openai"):
#   easyai.provider=openai
#   easyai.api-key=gsk_YOUR-KEY
#   easyai.base-url=https://api.groq.com/openai/v1/
#   easyai.model-name=openai/gpt-oss-120b
#
# Ollama example (local, no key needed):
#   easyai.provider=ollama
#   easyai.model-name=llama3

# --- Voice: speech to text   (EasyAI.listen()) --------------------------------
# Inherits provider / api-key / base-url from above. The MODEL does not:
# the default is OpenAI's whisper-1, so on another service name its model,
# e.g. whisper-large-v3 on Groq.
#easyai.stt.model-name=whisper-1
#easyai.stt.language=            # ISO-639-1; empty = the model detects it
#easyai.stt.api-key=
#easyai.stt.base-url=
#easyai.stt.provider=

# --- Voice: text to speech   (EasyAI.speak()) ---------------------------------
# Inherits provider / api-key / base-url from above; model and voice do not.
#easyai.tts.model-name=tts-1
#easyai.tts.voice=alloy
#easyai.tts.api-key=
#easyai.tts.base-url=
#easyai.tts.provider=

# --- Decisions   (EasyAI.decide()) --------------------------------------------
# WARNING: a decision model is a DEDICATED endpoint (POST {baseUrl}/decisions),
# not a chat completion. OpenAI-compatible CHAT providers such as Groq and
# DeepSeek do NOT implement it and answer 404. If your chat provider above is
# not OpenAI, set BOTH of these explicitly.
#easyai.decision.api-key=
#easyai.decision.base-url=https://api.openai.com/v1/
#easyai.decision.model-name=gpt-6-luna
#easyai.decision.provider=

# --- Milvus: persistent vector store (optional) -------------------------------
# Only for PERSISTENT RAG: EasyAI.indexer().toMilvus().index(...) to write,
# .withMilvus() to read. The in-memory withRAG(...) needs none of this.
# dimension must match your embedding model (384 = the bundled local model).
# Requires the <optional> langchain4j-easy-rag / langchain4j-milvus dependencies.
#easyai.milvus.host=localhost
#easyai.milvus.port=19530
#easyai.milvus.collection=documents
#easyai.milvus.dimension=384
#easyai.milvus.username=
#easyai.milvus.password=
